async function genCertFromTemplate(co,cert,r){
const std=CERTS.find(x=>x.id===cert.standard)||{};
const d=co.directorName||'';const dp=co.directorPosition||'Директор';
const prod=cert.productName||std.prod||'';
const bankName=co.bankName||'';
const replacements={
'{{COMPANY_NAME}}':co.companyName||'',
'{{LEGAL_ADDRESS}}':co.legalAddress||'',
'{{POSTAL_ADDRESS}}':co.legalAddress||'',
'{{ACTIVITY_ADDRESS}}':co.legalAddress||'',
'{{BANK_ACCOUNT}}':co.bankAccount||'',
'{{BANK_NAME}}':bankName,
'{{BIK}}':co.bik||'',
'{{BANK_ADDRESS}}':co.bankAddress||'',
'{{UNP}}':co.unp||'',
'{{PHONE}}':co.phone||'',
'{{EMAIL}}':co.email||'',
'{{DIRECTOR_LINE}}':dp+'а '+d+', действующего на основании Устава',
'{{PRODUCT_NAME}}':prod,
'{{TNVED}}':cert.tnved||std.tv||'7308',
'{{OKP}}':cert.okp||std.okp||'',
'{{STANDARD_DOC}}':(std.label||'')+' '+(std.fn||''),
'{{REQUIREMENTS}}':(std.tr||'')+', '+(std.label||''),
'{{PRODUCTION}}':cert.production||'Серийно',
'{{SCHEME}}':cert.scheme||'1С',
'{{DIRECTOR_SHORT}}':d,
'{{RESPONSIBLE}}':(r.name||'')+(r.phone?' '+r.phone:''),
};
// Decode base64 template
const binary=atob(CERT_TEMPLATE_B64);
const bytes=new Uint8Array(binary.length);
for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
// Open as ZIP, replace text in document.xml
const zip=await JSZip.loadAsync(bytes);
let docXml=await zip.file('word/document.xml').async('string');
for(const[placeholder,value]of Object.entries(replacements)){
docXml=docXml.split(placeholder).join(value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
}
zip.file('word/document.xml',docXml);
return await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

  const d=co.directorName||'';
  const dp=co.directorPosition||'Директор';
  const companyShort=(co.companyName||'').replace(/^Общество с ограниченной ответственностью\s+/i,'ООО ').replace(/^Открытое акционерное общество\s+/i,'ОАО ').replace(/^Закрытое акционерное общество\s+/i,'ЗАО ').replace(/^Частное предприятие\s+/i,'ЧП ').replace(/^Частное унитарное предприятие\s+/i,'ЧУП ').replace(/^Частное торговое унитарное предприятие\s+/i,'ЧТУП ').replace(/^Частное строительное унитарное предприятие\s+/i,'ЧСУП ').replace(/^Республиканское унитарное предприятие\s+/i,'РУП ').replace(/^Коммунальное унитарное предприятие\s+/i,'КУП ').replace(/^Индивидуальный предприниматель\s+/i,'ИП ');
  // Director short form: "А.Г. Алексеев" from "Алексеев Андрей Георгиевич"

  }

  const bankBikLine=[co.bankName,co.bik?'БИК: '+co.bik:''].filter(Boolean).join(', ');

      // Use BISP-specific formulation if available, else fallback to default
      const wName=w.bC||w.c||'';
      const wTnpa=w.bT||w.t||'';
      const wSub=(w.bS!==undefined?w.bS:(w.s||''));
      const wControl=w.bK||w.k||'';
      let row=templateRow;
      row=row.split('{{WORK_NAME}}').join(esc(wName));
      row=row.split('{{WORK_TNPA}}').join(esc(wTnpa));
      row=row.split('{{WORK_SUBLIST}}').join(esc(wSub.split(';').map(s=>s.trim()).filter(Boolean).join('; ')));
      row=row.split('{{WORK_CONTROL}}').join(esc(wControl));
      rowsXml+=row;
    }
    docXml=docXml.substring(0,startIdx)+rowsXml+docXml.substring(endIdx+endMarker.length);
  }
  zip.file('word/document.xml',docXml);
  return await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

// ============================================================
// УНИВЕРСАЛЬНЫЙ ПАРСЕР ДОКУМЕНТОВ (КП, СПК, договоры)
// Поддерживает .docx, .doc, PDF, JPG, PNG, HEIC.
// 
// Логика:
// 1. extractDocText(file) — извлекает текст из файла (DOCX → mammoth, PDF → pdf.js+OCR, изображения → OCR)
// 2. detectDocType(text) — определяет тип документа: 'kp' (КП с w-кодами) или 'spk' (СПК со списком работ) или 'unknown'
// 3. analyzeWorkTypes(text, type) — возвращает массив найденных видов работ с уровнем уверенности
// 4. handleDoc(file) — оркестрирует процесс, показывает диалог подтверждения эксперту
// ============================================================

// Нормализация текста: lowercase, замена ё→е, замена непечатных символов на пробел, схлопывание пробелов.
// Это важно для надёжного matching текста после OCR.
function normText(t){
  return (t||'')
    .toLowerCase()
    .replace(/ё/g,'е')
    .replace(/[^\p{L}\p{N}\s]+/gu,' ')  // оставляем только буквы, цифры и пробелы
    .replace(/\s+/g,' ')
    .trim();
}

// Извлечь текст из файла. Поддерживает docx, pdf, изображения.
async function extractDocText(file,onProgress){
  const name=(file.name||'').toLowerCase();
  // DOCX/DOC
  if(name.endsWith('.docx')||name.endsWith('.doc')){
    onProgress&&onProgress('Читаю .docx…');
    const buf=await file.arrayBuffer();
    const result=await mammoth.extractRawText({arrayBuffer:buf});
    return result.value||'';
  }
  // PDF
  if(name.endsWith('.pdf')){
    if(!ocrReady){
      if(ocrError)throw new Error('OCR недоступен: '+ocrError);
      onProgress&&onProgress('Жду загрузку OCR…');
      const start=Date.now();
      while(!ocrReady){
        if(ocrError)throw new Error('OCR недоступен: '+ocrError);
        if(Date.now()-start>60000)throw new Error('OCR не загрузился за 60 сек. Проверьте интернет.');
        await new Promise(r=>setTimeout(r,500));
      }
    }
    onProgress&&onProgress('Открываю PDF…');
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let fullText='';
    // Сначала попробуем извлечь встроенный текст (для PDF с реальным текстом)
    let embeddedTextLen=0;
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const tc=await page.getTextContent();
      const pageText=tc.items.map(it=>it.str).join(' ');
      embeddedTextLen+=pageText.length;
      fullText+='\n'+pageText;
    }
    // Если встроенного текста почти нет — это скан, используем OCR
    if(embeddedTextLen<100){
      fullText='';
      for(let i=1;i<=pdf.numPages;i++){
        onProgress&&onProgress(`Распознаю стр. ${i}/${pdf.numPages}…`);
        const page=await pdf.getPage(i);
        const viewport=page.getViewport({scale:2.5}); // увеличиваем разрешение для лучшего OCR
        const canvas=document.createElement('canvas');
        canvas.width=viewport.width;canvas.height=viewport.height;
        await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
        const r=await ocrWorker.recognize(canvas);
        fullText+='\n--- Страница '+i+' ---\n'+(r.data&&r.data.text||'');
      }
    } else {
      onProgress&&onProgress('Текст извлечён из PDF (без OCR)');
    }
    return fullText;
  }
  // Изображения (JPG, PNG, HEIC, etc.)
  if(/\.(jpe?g|png|webp|bmp|gif|tiff?|heic|heif)$/i.test(name)){
    if(!ocrReady){
      if(ocrError)throw new Error('OCR недоступен: '+ocrError);
      onProgress&&onProgress('Жду загрузку OCR…');
      const start=Date.now();
      while(!ocrReady){
        if(ocrError)throw new Error('OCR недоступен: '+ocrError);
        if(Date.now()-start>60000)throw new Error('OCR не загрузился за 60 сек.');
        await new Promise(r=>setTimeout(r,500));
      }
    }
    onProgress&&onProgress('Распознаю изображение…');
    // Загружаем картинку в canvas (Tesseract автоматически делает это, но мы хотим контроль размера)
    const url=URL.createObjectURL(file);
    try{
      const img=new Image();
      await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('Не удалось открыть изображение. Возможно, формат HEIC не поддерживается этим браузером — конвертируйте в JPG.'));img.src=url});
      const c=document.createElement('canvas');
      // upscale небольших картинок до минимум 1500px по большей стороне
      const minSide=1500;
      let w=img.width,h=img.height;
      if(Math.max(w,h)<minSide){
        const k=minSide/Math.max(w,h);
        w=Math.round(w*k);h=Math.round(h*k);
      }
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const r=await ocrWorker.recognize(c);
      return r.data&&r.data.text||'';
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  throw new Error('Поддерживаются .docx, .pdf, .jpg, .png, .webp, .heic');
}

// Определить тип документа по содержанию текста.
// Возвращает 'kp', 'spk' или 'unknown'.
function detectDocType(text){
  const t=text.toLowerCase();
  // КП — наш собственный формат от MAVIS GROUP, всегда содержит «коммерческое предложение» и/или «mavis group»
  if(t.includes('коммерческое предложение')||t.includes('mavis group')||t.includes('mavis')||t.includes('мавис')||t.includes('виды работ для спк')||t.includes('наши услуги'))return 'kp';
  // СПК — свидетельство о технической компетентности
  if(t.includes('свидетельство о технической компетентности')||t.includes('свидетельства о технической компетентности')||t.includes('область технической компетентности')||t.includes('к свидетельству')||t.includes('система производственного контроля')||t.includes('производственного контроля'))return 'spk';
  return 'unknown';
}

// Найти w-коды в тексте КП. Учитывает OCR-ошибки.
function findWCodes(text){
  const matched=new Set();
  const evidence={}; // wid → массив найденных строк (для отладки)
  const validIds=new Set(W.map(w=>w.id));
  // Регулярки: w[14], W[14], w 14, w.14, w,14, w-14, vv14, ww14
  // Без \b — кириллица его ломает в JS. Вместо границы — требуем что после цифр НЕ идёт цифра.
  const patterns=[
    /\b[wWвВuvшИи]{1,2}[\s.,\-:]*(\d{1,3})(?!\d)/g,
    /(?:^|[\s;,(])(\d{1,3})(?=[\s.,)])/g // числа сами по себе — слабый сигнал, используем только в крайнем случае
  ];
  // Используем только первый pattern для уверенного matching
  const re=/[wWвВuvшИиH]{1,2}[\s.,\-:]*(\d{1,3})(?!\d)/g;
  let m;
  while((m=re.exec(text))!==null){
    const num=parseInt(m[1],10);
    const id='w'+num;
    if(validIds.has(id)){
      matched.add(id);
      if(!evidence[id])evidence[id]=[];
      // Сохраним маленький контекст
      const start=Math.max(0,m.index-5);
      const end=Math.min(text.length,m.index+m[0].length+30);
      evidence[id].push(text.substring(start,end).replace(/\s+/g,' ').trim());
    }
  }
  return {matched,evidence};
}

// Найти виды работ по ключевым фразам в тексте (для СПК и как fallback для КП).
// Возвращает массив {id, confidence: 'high'|'med', matchedKey, context}
function findByKeyPhrases(text){
  const norm=normText(text);
  const results=[];
  for(const [wid,keys] of Object.entries(WORK_KEYS)){
    let bestKey=null;
    let bestLen=0;
    for(const key of keys){
      const normKey=normText(key);
      if(norm.includes(normKey)){
        if(normKey.length>bestLen){bestLen=normKey.length;bestKey=normKey}
      }
    }
    if(bestKey){
      // Уверенность зависит от длины ключевой фразы
      const conf=bestLen>=20?'high':'med';
      // Найдём контекст в исходном тексте
      const idx=norm.indexOf(bestKey);
      const ctxStart=Math.max(0,idx-10);
      const ctxEnd=Math.min(norm.length,idx+bestKey.length+20);
      const context=norm.substring(ctxStart,ctxEnd);
      results.push({id:wid,confidence:conf,matchedKey:bestKey,context});
    }
  }
  return results;
}

// Анализирует распознанный текст. Возвращает {type, found: [{id, confidence, evidence}], rawText}
function analyzeDoc(text){
  const type=detectDocType(text);
  let found=[];
  if(type==='kp'){
    // Для КП — основной сигнал w-коды, плюс перекрёстная проверка по ключевым фразам.
    const {matched,evidence}=findWCodes(text);
    const byKeys=findByKeyPhrases(text);
    const byKeysMap={};
    byKeys.forEach(r=>byKeysMap[r.id]=r);
    // Включаем все найденные по w-коду
    matched.forEach(id=>{
      const keyMatch=byKeysMap[id];
      // Если найден и w-код и ключевая фраза — high confidence
      const conf=keyMatch?'high':'med';
      const ev=(evidence[id]||[]).slice(0,2).join(' | ')+(keyMatch?' | "'+keyMatch.context+'"':'');
      found.push({id,confidence:conf,evidence:ev});
    });
    // Если по ключевой фразе нашлась high-confidence — добавим даже если w-код не нашёлся
    byKeys.forEach(r=>{
      if(r.confidence==='high' && !matched.has(r.id)){
        found.push({id:r.id,confidence:'med',evidence:'по ключевой фразе: "'+r.context+'"'});
      }
    });
  } else if(type==='spk'){
    // СПК — только по ключевым фразам.
    const byKeys=findByKeyPhrases(text);
    byKeys.forEach(r=>{
      found.push({id:r.id,confidence:r.confidence,evidence:'"'+r.context+'"'});
    });
  } else {
    // unknown — пробуем оба способа, но с пометкой
    const {matched,evidence}=findWCodes(text);
    matched.forEach(id=>found.push({id,confidence:'med',evidence:(evidence[id]||[]).slice(0,2).join(' | ')}));
    if(found.length===0){
      const byKeys=findByKeyPhrases(text);
      byKeys.forEach(r=>found.push({id:r.id,confidence:r.confidence,evidence:'"'+r.context+'"'}));
    }
  }
  // Сортируем по id (w1, w2, ...)
  found.sort((a,b)=>parseInt(a.id.substring(1),10)-parseInt(b.id.substring(1),10));
  return {type,found,rawText:text};
}

// Основной обработчик: загружает файл, анализирует, готовит диалог подтверждения.
async function handleDoc(file){
  if(!file)return;
  S.kpMsg='';S.kpRawText='';S.kpProgress='⏳ Начинаю обработку…';S.docConfirm=null;render();
  try{
    const text=await extractDocText(file,(msg)=>{S.kpProgress='⏳ '+msg;render()});
    const analysis=analyzeDoc(text);
    const typeLabel=analysis.type==='kp'?'Коммерческое предложение (КП)':(analysis.type==='spk'?'Свидетельство о технич. компетентности (СПК)':'Документ');
    if(analysis.found.length===0){
      S.kpMsg='⚠️ Тип документа: '+typeLabel+'. Виды работ не распознаны. Распознанный текст ниже — отметьте нужные виды вручную.';
      S.kpRawText=text.substring(0,4000)+(text.length>4000?'\n…(обрезано)':'');
      S.docConfirm=null;
    } else {
      // Готовим объект для диалога подтверждения. По умолчанию high-confidence — отмечены, med — нет.
      S.docConfirm={
        type:analysis.type,
        typeLabel:typeLabel,
        fileName:file.name,
        items:analysis.found.map(r=>({
          id:r.id,
          confidence:r.confidence,
          evidence:r.evidence,
          // Авто-отмечены только те, в чём уверенны
          checked:r.confidence==='high'
        })),
        rawText:text
      };
      S.kpMsg='';
    }
  }catch(e){
    console.error(e);
    S.kpMsg='❌ Ошибка: '+(e.message||String(e));
  }
  S.kpProgress='';
  render();
}

// Принять выбор эксперта из диалога подтверждения.
function confirmDoc(){
  if(!S.docConfirm)return;
  let added=0;
  S.docConfirm.items.forEach(it=>{
    if(it.checked){S.sw.add(it.id);added++}
  });
  S.kpMsg='✅ Из документа добавлено видов работ: '+added+' (тип: '+S.docConfirm.typeLabel+')';
  S.docConfirm=null;
  render();
}
function cancelDoc(){S.docConfirm=null;render()}
// Переключение чекбокса в диалоге без полного re-render
function toggleDocItem(idx){
  if(!S.docConfirm||!S.docConfirm.items[idx])return;
  S.docConfirm.items[idx].checked=!S.docConfirm.items[idx].checked;
  const cb=document.querySelector(`[data-dc-idx="${idx}"]`);
  if(cb)cb.checked=S.docConfirm.items[idx].checked;
  // обновим счётчик
  const cnt=document.getElementById('dcCount');
  if(cnt)cnt.textContent=S.docConfirm.items.filter(i=>i.checked).length;
}
function selectAllDocItems(check){
  if(!S.docConfirm)return;
  S.docConfirm.items.forEach(it=>it.checked=check);
  render();
}

// ACTIONS
// Filter work types by current search query.
// Список видов работ, доступных для текущего типа заявки.
// БИСП: исключаем skipBisp. Стройкомплекс: исключаем skipStroy.
// Также применяется фильтр по строке поиска S.ws.
function worksForCurrentType(){
  return W.filter(w=>{
    if(S.appType==='bisp' && w.skipBisp) return false;
    if(S.appType==='stroycomplex' && w.skipStroy) return false;
    return true;
  });
}
// Имя вида работ для отображения в UI (БИСП: bC если есть, иначе c).
function workDisplayName(w){
  if(S.appType==='bisp' && w.bC) return w.bC;
  return w.c;
}
function workDisplayTnpa(w){
  if(S.appType==='bisp' && w.bT) return w.bT;
  return w.t;
}
function workDisplaySublist(w){
  if(S.appType==='bisp' && w.bS!==undefined) return w.bS;
  return w.s;
}
function workDisplayControl(w){
  if(S.appType==='bisp' && w.bK) return w.bK;
  return w.k;
}
function filteredWorks(){
  const list=worksForCurrentType();
  if(!S.ws)return list;
  const q=S.ws.toLowerCase();
  return list.filter(w=>{
    const name=workDisplayName(w).toLowerCase();
    const sub=(workDisplaySublist(w)||'').toLowerCase();
    return name.includes(q)||sub.includes(q);
  });
}
// Render the list of work-type items (used both in initial render and in partial updates).
function renderWtItems(){return filteredWorks().map(w=>{const nm=workDisplayName(w),tn=workDisplayTnpa(w),kc=workDisplayControl(w),sb=workDisplaySublist(w);return `<div class="wt-item ${S.sw.has(w.id)?'checked':''}" data-wid="${w.id}" onclick="tgW('${w.id}')"><input type="checkbox" ${S.sw.has(w.id)?'checked':''} onclick="event.stopPropagation()" onchange="tgW('${w.id}')"><div style="flex:1"><div class="wt-nm">${E(nm)}</div><div class="wt-tnpa">${E(tn)} → ${E(kc)}</div>${sb?`<div class="wt-sub">${E(sb.split(';').slice(0,3).join('; '))}${sb.split(';').length>3?' ...':''}</div>`:''}</div></div>`}).join('')}
// Re-render only the list (used during search typing) without touching scroll position.
function renderWtList(){const el=document.getElementById('wtList');if(el)el.innerHTML=renderWtItems()}
// Toggle a single work type WITHOUT calling full render() (preserves scroll position).
function tgW(id){
  if(S.sw.has(id))S.sw.delete(id);else S.sw.add(id);
  // Update only the affected item and the counter
  const item=document.querySelector(`.wt-item[data-wid="${id}"]`);
  if(item){
    item.classList.toggle('checked',S.sw.has(id));
    const cb=item.querySelector('input[type=checkbox]');
    if(cb)cb.checked=S.sw.has(id);
  }
  const c1=document.getElementById('swCount');if(c1)c1.textContent=S.sw.size;
  const c2=document.getElementById('wtCount');if(c2)c2.textContent='Выбрано: '+S.sw.size+' из '+worksForCurrentType().length;
}
// Select all currently-visible (filtered) work types.
function selectAllVisible(){filteredWorks().forEach(w=>S.sw.add(w.id));renderWtList();const c1=document.getElementById('swCount');if(c1)c1.textContent=S.sw.size;const c2=document.getElementById('wtCount');if(c2)c2.textContent='Выбрано: '+S.sw.size+' из '+worksForCurrentType().length}
// Clear all selections.
function clearAllWorks(){S.sw.clear();S.kpMsg='';S.kpRawText='';S.docConfirm=null;renderWtList();const c1=document.getElementById('swCount');if(c1)c1.textContent=S.sw.size;const c2=document.getElementById('wtCount');if(c2)c2.textContent='Выбрано: '+S.sw.size+' из '+worksForCurrentType().length;render()}

// renderDocConfirm — карточка с найденными в документе видами работ и галочками для подтверждения.
// Каждый элемент: чекбокс + название работ + индикатор уверенности + контекст из текста.
// Кнопки: «Добавить выбранные», «Отмена», «Выбрать все», «Снять все».
function renderDocConfirm(){
  if(!S.docConfirm)return '';
  const dc=S.docConfirm;
  const checkedCount=dc.items.filter(i=>i.checked).length;
  const itemsHtml=dc.items.map((it,idx)=>{
    const w=W.find(x=>x.id===it.id);
    if(!w)return '';
    const confColor=it.confidence==='high'?'#059669':'#a16207';
    const confLabel=it.confidence==='high'?'высокая уверенность':'возможно';
    const confBg=it.confidence==='high'?'#d1fae5':'#fef3c7';
    return `<div class="dc-item"><input type="checkbox" ${it.checked?'checked':''} data-dc-idx="${idx}" onchange="toggleDocItem(${idx})"><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-weight:600;font-size:13px">${E(w.c)}</span><span style="font-size:11px;background:${confBg};color:${confColor};padding:2px 7px;border-radius:10px;font-weight:500">${confLabel}</span></div><div style="font-size:11px;color:#64748b;margin-top:3px;font-style:italic">📝 ${E(it.evidence||'')}</div></div></div>`;
  }).join('');
  return `<div class="doc-confirm-card">
    <div class="dc-header">
      <div><b>📋 Найдено в документе:</b> ${E(dc.typeLabel)}</div>
      <div style="font-size:12px;color:#64748b;margin-top:2px">${E(dc.fileName||'')} → видов работ: <span id="dcCount">${checkedCount}</span> из ${dc.items.length}</div>
    </div>
    <div style="display:flex;gap:6px;margin:8px 0;flex-wrap:wrap">
      <button class="btn-bx" onclick="selectAllDocItems(true)" style="background:#059669;font-size:12px;padding:4px 10px">✓ Все</button>
      <button class="btn-bx" onclick="selectAllDocItems(false)" style="background:#94a3b8;font-size:12px;padding:4px 10px">Снять все</button>
    </div>
    <div class="dc-list">${itemsHtml}</div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn-bx" onclick="confirmDoc()" style="background:#2563eb">✓ Добавить выбранные</button>
      <button class="btn-bx" onclick="cancelDoc()" style="background:#94a3b8">Отмена</button>
    </div>
  </div>`;
}

function docSetType(t){docState.docType=t;renderDoc()}
function docReset(){docState.files=[];docState.currentFile=0;docState.currentPage=0;renderDoc()}
function docSwitchFile(i){docState.currentFile=i;docState.currentPage=0;renderDoc()}
function docSwitchPage(i){docState.currentPage=i;renderDoc()}
function docCountUnprocessed(){let n=0;for(const f of docState.files)for(const p of f.pages)if(!p.processedCanvas)n++;return n}

async function docLoadFiles(fileList){
  if(!fileList||fileList.length===0)return;
  for(const f of fileList){
    try{
      const pages=[];
      if(f.type==='application/pdf' || f.name.toLowerCase().endsWith('.pdf')){
        const ab=await f.arrayBuffer();
        const pdf=await pdfjsLib.getDocument({data:ab}).promise;
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i);
          const viewport=page.getViewport({scale:2.0}); // 2x for quality
          const c=document.createElement('canvas');
          c.width=viewport.width;
          c.height=viewport.height;
          await page.render({canvasContext:c.getContext('2d'),viewport}).promise;
          pages.push({originalCanvas:c,processedCanvas:null,rotation:0});
        }
      } else {
        // image
        const url=URL.createObjectURL(f);
        const img=new Image();
        await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
        const c=document.createElement('canvas');
        // Limit size for perf (max 2400px longest side)
        const maxSide=2400;
        let w=img.width,h=img.height;
        if(Math.max(w,h)>maxSide){
          const k=maxSide/Math.max(w,h);
          w=Math.round(w*k);h=Math.round(h*k);
        }
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        pages.push({originalCanvas:c,processedCanvas:null,rotation:0});
      }
      docState.files.push({name:f.name,pages});
    }catch(e){
      alert('Ошибка загрузки '+f.name+': '+e.message);
    }
  }
  renderDoc();
}

async function docProcessCurrent(){
  const D=docState;
  const page=D.files[D.currentFile]?.pages[D.currentPage];
  if(!page)return;
  D.processing=true;renderDoc();
  try{
    await new Promise(r=>setTimeout(r,30)); // let UI update
    page.processedCanvas=await docEnhance(page.originalCanvas,D.docType);
    page.rotation=0;
  }catch(e){
    console.error(e);
    alert('Ошибка обработки: '+e.message);
  }
  D.processing=false;renderDoc();
}

async function docProcessAll(){
  const D=docState;
  D.processing=true;renderDoc();
  try{
    for(let fi=0;fi<D.files.length;fi++){
      for(let pi=0;pi<D.files[fi].pages.length;pi++){
        const page=D.files[fi].pages[pi];
        if(!page.processedCanvas){
          D.currentFile=fi;D.currentPage=pi;
          // Yield to UI between pages

          page.processedCanvas=await docEnhance(page.originalCanvas,D.docType);
          page.rotation=0;

}

function docRotate(deg){
  const page=docState.files[docState.currentFile]?.pages[docState.currentPage];
  if(!page||!page.processedCanvas)return;
  const src=page.processedCanvas;
  const c=document.createElement('canvas');
  const ctx=c.getContext('2d');
  if(deg===90){
    c.width=src.height;c.height=src.width;
    ctx.translate(c.width,0);ctx.rotate(Math.PI/2);
    ctx.drawImage(src,0,0);
  } else if(deg===-90){
    c.width=src.height;c.height=src.width;
    ctx.translate(0,c.height);ctx.rotate(-Math.PI/2);
    ctx.drawImage(src,0,0);
  } else if(deg===180){
    c.width=src.width;c.height=src.height;
    ctx.translate(c.width,c.height);ctx.rotate(Math.PI);
    ctx.drawImage(src,0,0);
  }
  page.processedCanvas=c;
  renderDoc();
}

function docDownloadCurrent(){
  const page=docState.files[docState.currentFile]?.pages[docState.currentPage];
  if(!page||!page.processedCanvas)return;
  const file=docState.files[docState.currentFile];
  const name=file.name.replace(/\.(pdf|jpe?g|png|heic)$/i,'');
  const suffix=file.pages.length>1?`_p${docState.currentPage+1}`:'';
  page.processedCanvas.toBlob(b=>saveAs(b,`${name}${suffix}_enhanced.png`),'image/png');
}

async function docDownloadPDF(mode){
  // mode: 'color' | 'bw'
  const D=docState;
  // Collect all processed pages from all files
  const pages=[];
  for(const f of D.files)for(const p of f.pages)if(p.processedCanvas)pages.push({file:f,page:p});
  if(pages.length===0){alert('Нет обработанных страниц');return}
  const {jsPDF}=window.jspdf;
  let pdf=null;
  for(let i=0;i<pages.length;i++){
    const src=pages[i].page.processedCanvas;
    // Choose canvas depending on mode
    let canvas=src;
    if(mode==='bw'){
      canvas=docToBW(src);
    }
    // Orient page (portrait/landscape)
    const isLandscape=canvas.width>canvas.height;
    const w=isLandscape?297:210;
    const h=isLandscape?210:297;
    if(!pdf){
      pdf=new jsPDF({unit:'mm',format:'a4',orientation:isLandscape?'l':'p'});
    } else {
      pdf.addPage('a4',isLandscape?'l':'p');
    }
    // Fit image to page with margin
    const margin=5;
    const pw=w-2*margin,ph=h-2*margin;
    const ar=canvas.width/canvas.height;
    let iw=pw,ih=pw/ar;
    if(ih>ph){ih=ph;iw=ph*ar}
    const x=(w-iw)/2,y=(h-ih)/2;
    const imgData=canvas.toDataURL('image/jpeg',mode==='bw'?0.75:0.85);
    pdf.addImage(imgData,'JPEG',x,y,iw,ih);
  }
  const baseName=D.files[0].name.replace(/\.(pdf|jpe?g|png|heic)$/i,'');
  const suffix=mode==='bw'?'_для_органа':'_обработано';
  pdf.save(`${baseName}${suffix}.pdf`);
}

function docToBW(srcCanvas){
  // Convert already-enhanced canvas to strict B/W (binarized)
  const c=document.createElement('canvas');
  c.width=srcCanvas.width;c.height=srcCanvas.height;
  const ctx=c.getContext('2d');
  ctx.drawImage(srcCanvas,0,0);
  const img=ctx.getImageData(0,0,c.width,c.height);
  const d=img.data;
  for(let i=0;i<d.length;i+=4){
    // Luminance
    const lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    // Soft threshold: keep mid-tones slightly
    const v=lum<180?0:(lum<220?Math.round((lum-180)*255/40):255);
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,0,0);
  return c;
}

// ============ PURE JS DOCUMENT ENHANCEMENT PIPELINE ============
// Работает на canvas + ImageData без каких-либо нативных библиотек.
// Совместимо по функциональности с прежней OpenCV-версией.

async function docEnhance(srcCanvas,docType){
  // Pipeline:
  //   1) детекция контура документа (если нашли — перспективный warp)
  //   2) детекция ориентации (0/90/180/270)
  //   3) deskew (тонкий поворот по горизонталям)
  //   4) aggressive enhance (фон/контраст/резкость)
  let work=_cloneCanvas(srcCanvas);
  try{
    const pts=_detectDocumentContour(work);
    if(pts){
      work=_fourPointWarp(work,pts);
    }
    work=_detectOrientation(work);
    work=_deskew(work);
    work=_enhanceAggressive(work);
    return work;
  }catch(e){
    console.error('[docEnhance] error, returning original:',e);
    return srcCanvas;
  }
}

// -------- helpers --------
function _cloneCanvas(src){
  const c=document.createElement('canvas');
  c.width=src.width;c.height=src.height;
  c.getContext('2d').drawImage(src,0,0);
  return c;
}
function _canvasGray(srcCanvas){
  // Возвращает Uint8ClampedArray длины w*h (только luminance)
  const ctx=srcCanvas.getContext('2d');
  const img=ctx.getImageData(0,0,srcCanvas.width,srcCanvas.height);
  const d=img.data;
  const out=new Uint8ClampedArray(srcCanvas.width*srcCanvas.height);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    out[j]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;
  }
  return out;
}
function _resizeGray(src,srcW,srcH,dstW,dstH){
  // Билинейный ресайз одноканального массива (nearest для скорости на downscale)
  const dst=new Uint8ClampedArray(dstW*dstH);
  const xr=srcW/dstW,yr=srcH/dstH;
  for(let y=0;y<dstH;y++){
    const sy=Math.min(srcH-1,(y*yr)|0);
    for(let x=0;x<dstW;x++){
      const sx=Math.min(srcW-1,(x*xr)|0);
      dst[y*dstW+x]=src[sy*srcW+sx];
    }
  }
  return dst;
}
function _gaussBlur(src,w,h,radius){
  // Двухпроходная box-aproximation гауссового размытия
  // radius — целое число пикселей
  const r=Math.max(1,radius|0);
  const size=r*2+1;
  const temp=new Float32Array(w*h);
  const out=new Uint8ClampedArray(w*h);
  // horizontal
  for(let y=0;y<h;y++){
    const row=y*w;
    let sum=0;
    for(let x=-r;x<=r;x++)sum+=src[row+Math.max(0,Math.min(w-1,x))];
    for(let x=0;x<w;x++){
      temp[row+x]=sum/size;
      const add=src[row+Math.min(w-1,x+r+1)];
      const sub=src[row+Math.max(0,x-r)];
      sum+=add-sub;
    }
  }
  // vertical
  for(let x=0;x<w;x++){
    let sum=0;
    for(let y=-r;y<=r;y++)sum+=temp[Math.max(0,Math.min(h-1,y))*w+x];
    for(let y=0;y<h;y++){
      out[y*w+x]=sum/size;
      const add=temp[Math.min(h-1,y+r+1)*w+x];
      const sub=temp[Math.max(0,y-r)*w+x];
      sum+=add-sub;
    }
  }
  return out;
}
function _otsuThreshold(gray,w,h){
  // Otsu → возвращает бинарный массив (0/255)
  const hist=new Uint32Array(256);
  for(let i=0;i<gray.length;i++)hist[gray[i]]++;
  const total=gray.length;
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sumB=0,wB=0,maxVar=-1,threshold=128;
  for(let t=0;t<256;t++){
    wB+=hist[t];if(wB===0)continue;
    const wF=total-wB;if(wF===0)break;
    sumB+=t*hist[t];
    const mB=sumB/wB,mF=(sum-sumB)/wF;
    const v=wB*wF*(mB-mF)*(mB-mF);
    if(v>maxVar){maxVar=v;threshold=t}
  }
  const out=new Uint8ClampedArray(gray.length);
  for(let i=0;i<gray.length;i++)out[i]=gray[i]>threshold?255:0;
  return out;
}
function _sobelMagnitude(gray,w,h){
  // Вычисляет |∇I| — используется как простая замена Canny
  const out=new Uint8ClampedArray(w*h);
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const i=y*w+x;
      const gx=
        -gray[i-w-1]-2*gray[i-1]-gray[i+w-1]
        +gray[i-w+1]+2*gray[i+1]+gray[i+w+1];
      const gy=
        -gray[i-w-1]-2*gray[i-w]-gray[i-w+1]
        +gray[i+w-1]+2*gray[i+w]+gray[i+w+1];
      const m=Math.hypot(gx,gy);
      out[i]=m>255?255:m|0;
    }
  }
  return out;
}

// -------- 1. Детекция контура документа --------
// Стратегия: ищем большой светлый прямоугольник на тёмном фоне ИЛИ наоборот.
// Работаем на уменьшенной копии (max 800px) для скорости.
function _detectDocumentContour(srcCanvas){
  const W=srcCanvas.width,H=srcCanvas.height;
  const targetMax=800;
  const scale=Math.min(1,targetMax/Math.max(W,H));
  const sw=Math.round(W*scale),sh=Math.round(H*scale);
  // Downscale на canvas для качества (браузер делает смешивание)
  const small=document.createElement('canvas');
  small.width=sw;small.height=sh;
  small.getContext('2d').drawImage(srcCanvas,0,0,sw,sh);
  const gray=_canvasGray(small);
  const blurred=_gaussBlur(gray,sw,sh,2);

  const candidates=[];

  // Стратегия A: Otsu (прямая и инверсная) — ловит контрастные границы
  const otsu=_otsuThreshold(blurred,sw,sh);
  _collectQuadsFromBinary(otsu,sw,sh,candidates,'otsu');
  const otsuInv=new Uint8ClampedArray(otsu.length);
  for(let i=0;i<otsu.length;i++)otsuInv[i]=255-otsu[i];
  _collectQuadsFromBinary(otsuInv,sw,sh,candidates,'otsu-inv');

  // Стратегия B: край по градиенту (простая замена Canny+dilate)
  const sob=_sobelMagnitude(blurred,sw,sh);
  // Пороги — «сильные» градиенты
  const edges=new Uint8ClampedArray(sob.length);
  for(let i=0;i<sob.length;i++)edges[i]=sob[i]>40?255:0;
  // Морфологическое замыкание — чтобы соединить разрывы в рамке
  const dilated=_dilate3x3(edges,sw,sh,2);
  _collectQuadsFromBinary(dilated,sw,sh,candidates,'edges');

  if(candidates.length===0)return null;

  // Оцениваем кандидатов: площадь × симметрия сторон
  const minArea=sw*sh*0.15, maxArea=sw*sh*0.98;
  let best=null,bestScore=0;
  for(const cand of candidates){
    if(cand.area<minArea||cand.area>maxArea)continue;
    const pts=_orderQuad(cand.pts);
    const wA=_dist(pts[1],pts[0]),wB=_dist(pts[2],pts[3]);
    const hA=_dist(pts[3],pts[0]),hB=_dist(pts[2],pts[1]);
    const wsym=Math.min(wA,wB)/(Math.max(wA,wB)+1);
    const hsym=Math.min(hA,hB)/(Math.max(hA,hB)+1);
    const aw=(wA+wB)/2,ah=(hA+hB)/2;
    const ar=Math.min(aw,ah)/(Math.max(aw,ah)+1);
    const score=cand.area*wsym*hsym*(0.3+ar);
    if(score>bestScore){bestScore=score;best={pts}}
  }
  if(!best)return null;
  // Масштабируем обратно к исходному разрешению
  return best.pts.map(p=>[p[0]/scale,p[1]/scale]);
}

function _dilate3x3(bin,w,h,iterations){
  let src=bin,tmp;
  for(let it=0;it<iterations;it++){
    tmp=new Uint8ClampedArray(w*h);
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const i=y*w+x;
        if(src[i]){tmp[i]=255;continue}
        let on=false;
        for(let dy=-1;dy<=1&&!on;dy++){
          for(let dx=-1;dx<=1&&!on;dx++){
            const xx=x+dx,yy=y+dy;
            if(xx>=0&&xx<w&&yy>=0&&yy<h&&src[yy*w+xx])on=true;
          }
        }
        tmp[i]=on?255:0;
      }
    }
    src=tmp;
  }
  return src;
}

function _collectQuadsFromBinary(bin,w,h,out,tag){
  // Упрощённый поиск крупных связных компонент (flood fill через BFS),
  // строим bounding box + грубый 4-угольник по крайним точкам.
  const visited=new Uint8Array(w*h);
  const minCompArea=w*h*0.1;
  const queue=new Int32Array(w*h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const start=y*w+x;
      if(visited[start]||!bin[start])continue;
      // BFS
      let head=0,tail=0;
      queue[tail++]=start;
      visited[start]=1;
      let area=0;
      let minX=x,maxX=x,minY=y,maxY=y;
      // Для грубого 4-угольника найдём экстремальные по диагоналям
      let tlS=Infinity,brS=-Infinity,trD=Infinity,blD=-Infinity;
      let tlP=[x,y],brP=[x,y],trP=[x,y],blP=[x,y];
      while(head<tail){
        const idx=queue[head++];
        const cy=(idx/w)|0,cx=idx-cy*w;
        area++;
        if(cx<minX)minX=cx;if(cx>maxX)maxX=cx;
        if(cy<minY)minY=cy;if(cy>maxY)maxY=cy;
        const s=cx+cy,dd=cy-cx;
        if(s<tlS){tlS=s;tlP=[cx,cy]}
        if(s>brS){brS=s;brP=[cx,cy]}
        if(dd<trD){trD=dd;trP=[cx,cy]}
        if(dd>blD){blD=dd;blP=[cx,cy]}
        // 4-соседи
        if(cx>0){const n=idx-1;if(!visited[n]&&bin[n]){visited[n]=1;queue[tail++]=n}}
        if(cx<w-1){const n=idx+1;if(!visited[n]&&bin[n]){visited[n]=1;queue[tail++]=n}}
        if(cy>0){const n=idx-w;if(!visited[n]&&bin[n]){visited[n]=1;queue[tail++]=n}}
        if(cy<h-1){const n=idx+w;if(!visited[n]&&bin[n]){visited[n]=1;queue[tail++]=n}}
      }
      if(area<minCompArea)continue;
      // Отсеиваем компоненты, примыкающие к границе слишком сильно (вероятно фон)
      const touchesBorder=(minX<=1)+(minY<=1)+(maxX>=w-2)+(maxY>=h-2);
      if(touchesBorder>=3)continue; // компонент упирается в 3+ края — это фон
      out.push({tag,area,pts:[tlP,trP,brP,blP]});
    }
  }
}

function _dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])}
function _orderQuad(pts){
  // TL(min sum), TR(min diff y-x), BR(max sum), BL(max diff y-x)
  const sums=pts.map(p=>p[0]+p[1]);
  const diffs=pts.map(p=>p[1]-p[0]);
  return [
    pts[sums.indexOf(Math.min(...sums))],
    pts[diffs.indexOf(Math.min(...diffs))],
    pts[sums.indexOf(Math.max(...sums))],
    pts[diffs.indexOf(Math.max(...diffs))]
  ];
}

// -------- 2. Перспективный warp --------
function _fourPointWarp(srcCanvas,pts){
  const [tl,tr,br,bl]=_orderQuad(pts);
  const wA=_dist(br,bl),wB=_dist(tr,tl);
  const maxW=Math.round(Math.max(wA,wB));
  const hA=_dist(tr,br),hB=_dist(tl,bl);
  const maxH=Math.round(Math.max(hA,hB));
  if(maxW<10||maxH<10)return _cloneCanvas(srcCanvas);
  // Считаем homography-матрицу из 4 точек через линейную систему 8x8
  const H=_computeHomography(
    [[0,0],[maxW-1,0],[maxW-1,maxH-1],[0,maxH-1]],
    [tl,tr,br,bl]
  );
  if(!H)return _cloneCanvas(srcCanvas);
  // Перебираем dst-пиксели, берём пикселы из src через inverse-map H
  const srcCtx=srcCanvas.getContext('2d');
  const srcImg=srcCtx.getImageData(0,0,srcCanvas.width,srcCanvas.height);
  const sd=srcImg.data, SW=srcCanvas.width, SH=srcCanvas.height;
  const dst=document.createElement('canvas');
  dst.width=maxW;dst.height=maxH;
  const dctx=dst.getContext('2d');
  const out=dctx.createImageData(maxW,maxH);
  const od=out.data;
  for(let y=0;y<maxH;y++){
    for(let x=0;x<maxW;x++){
      // Применяем H к (x,y) → (sx,sy) в исходнике
      const denom=H[6]*x+H[7]*y+H[8];
      const sxf=(H[0]*x+H[1]*y+H[2])/denom;
      const syf=(H[3]*x+H[4]*y+H[5])/denom;
      const k=(y*maxW+x)*4;
      if(sxf<0||sxf>=SW-1||syf<0||syf>=SH-1){
        od[k]=od[k+1]=od[k+2]=255;od[k+3]=255;
        continue;
      }
      // Билинейная интерполяция
      const sx0=sxf|0,sy0=syf|0;
      const fx=sxf-sx0,fy=syf-sy0;
      const i00=(sy0*SW+sx0)*4;
      const i10=i00+4;
      const i01=i00+SW*4;
      const i11=i01+4;
      for(let c=0;c<3;c++){
        const v=sd[i00+c]*(1-fx)*(1-fy)+sd[i10+c]*fx*(1-fy)
               +sd[i01+c]*(1-fx)*fy   +sd[i11+c]*fx*fy;
        od[k+c]=v|0;
      }
      od[k+3]=255;
    }
  }
  dctx.putImageData(out,0,0);
  return dst;
}

function _computeHomography(src,dst){
  // src[i] → dst[i], 4 пары точек. Решаем 8x8 линейную систему.
  // Возвращает 3x3 матрицу [h0..h8] (h8=1).
  const A=[],b=[];
  for(let i=0;i<4;i++){
    const [x,y]=src[i],[X,Y]=dst[i];
    A.push([x,y,1,0,0,0,-X*x,-X*y]);b.push(X);
    A.push([0,0,0,x,y,1,-Y*x,-Y*y]);b.push(Y);
  }
  const h=_solveLinear(A,b);
  if(!h)return null;
  return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
}
function _solveLinear(A,b){
  // Простой метод Гаусса с частичным выбором главного элемента
  const n=A.length;
  const M=A.map((row,i)=>row.concat([b[i]]));
  for(let i=0;i<n;i++){
    // pivot
    let maxR=i,maxV=Math.abs(M[i][i]);
    for(let r=i+1;r<n;r++){
      const v=Math.abs(M[r][i]);
      if(v>maxV){maxV=v;maxR=r}
    }
    if(maxV<1e-12)return null;
    if(maxR!==i){const t=M[i];M[i]=M[maxR];M[maxR]=t}
    // eliminate
    for(let r=i+1;r<n;r++){
      const f=M[r][i]/M[i][i];
      for(let c=i;c<=n;c++)M[r][c]-=f*M[i][c];
    }
  }
  // back-substitution
  const x=new Array(n);
  for(let i=n-1;i>=0;i--){
    let s=M[i][n];
    for(let c=i+1;c<n;c++)s-=M[i][c]*x[c];
    x[i]=s/M[i][i];
  }
  return x;
}

// -------- 3. Детекция ориентации 0/90/180/270 --------
function _detectOrientation(srcCanvas){
  // Скоринг: 1) row_std/col_std (горизонтальные линии текста дают высокий rowStd)
  //          2) peak в верхней трети (заголовки/номера у верха)
  const gray=_canvasGray(srcCanvas);
  const W=srcCanvas.width,H=srcCanvas.height;
  const targetMax=600;
  const scale=Math.min(1,targetMax/Math.max(W,H));
  const sw=Math.max(1,Math.round(W*scale)),sh=Math.max(1,Math.round(H*scale));
  const small=_resizeGray(gray,W,H,sw,sh);

  function scoreRotated(arr,w,h){
    // Ожидаем бинаризованный массив (0/255). Считаем rowSums / colSums.
    const rowSums=new Float64Array(h);
    const colSums=new Float64Array(w);
    for(let y=0;y<h;y++){
      let s=0;
      for(let x=0;x<w;x++){const v=arr[y*w+x]?1:0;s+=v;colSums[x]+=v}
      rowSums[y]=s;
    }
    const rowStd=_stdDev(rowSums),colStd=_stdDev(colSums);
    const line=rowStd/(colStd+1);
    // smoothed max в трети
    const smoothed=new Float64Array(h);
    for(let i=0;i<h;i++){
      let s=0,n=0;
      for(let k=-2;k<=2;k++){const j=i+k;if(j>=0&&j<h){s+=rowSums[j];n++}}
      smoothed[i]=s/n;
    }
    const t1=(h/3)|0,t2=(2*h/3)|0;
    let topM=0,midM=0,botM=0;
    for(let i=0;i<t1;i++)if(smoothed[i]>topM)topM=smoothed[i];
    for(let i=t1;i<t2;i++)if(smoothed[i]>midM)midM=smoothed[i];
    for(let i=t2;i<h;i++)if(smoothed[i]>botM)botM=smoothed[i];
    const header=topM/(midM+botM+1);
    return line*(1+header);
  }
  // Инвертированная бинаризация: тёмный текст → 1
  const bin=new Uint8ClampedArray(small.length);
  const thr=_otsuLevel(small);
  for(let i=0;i<small.length;i++)bin[i]=small[i]<thr?255:0;

  // Генерируем 4 варианта
  const variants=[
    {code:0,arr:bin,w:sw,h:sh},
    {code:1,arr:_rotate90(bin,sw,sh),w:sh,h:sw},
    {code:2,arr:_rotate180(bin,sw,sh),w:sw,h:sh},
    {code:3,arr:_rotate270(bin,sw,sh),w:sh,h:sw}
  ];
  let bestCode=0,bestScore=-1;
  for(const v of variants){
    const s=scoreRotated(v.arr,v.w,v.h);
    if(s>bestScore){bestScore=s;bestCode=v.code}
  }
  if(bestCode===0)return srcCanvas;
  return _rotateCanvas(srcCanvas,bestCode*90);
}
function _stdDev(arr){
  let m=0;for(let i=0;i<arr.length;i++)m+=arr[i];m/=arr.length;
  let s=0;for(let i=0;i<arr.length;i++){const d=arr[i]-m;s+=d*d}
  return Math.sqrt(s/arr.length);
}
function _otsuLevel(gray){
  const hist=new Uint32Array(256);
  for(let i=0;i<gray.length;i++)hist[gray[i]]++;
  const total=gray.length;
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sumB=0,wB=0,maxVar=-1,thr=128;
  for(let t=0;t<256;t++){
    wB+=hist[t];if(wB===0)continue;
    const wF=total-wB;if(wF===0)break;
    sumB+=t*hist[t];
    const mB=sumB/wB,mF=(sum-sumB)/wF;
    const v=wB*wF*(mB-mF)*(mB-mF);
    if(v>maxVar){maxVar=v;thr=t}
  }
  return thr;
}
function _rotate90(src,w,h){ // clockwise
  const dst=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)dst[x*h+(h-1-y)]=src[y*w+x];
  return dst;
}
function _rotate180(src,w,h){
  const dst=new Uint8ClampedArray(w*h);
  for(let i=0;i<src.length;i++)dst[src.length-1-i]=src[i];
  return dst;
}
function _rotate270(src,w,h){ // counter-clockwise
  const dst=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)dst[(w-1-x)*h+y]=src[y*w+x];
  return dst;
}
function _rotateCanvas(srcCanvas,deg){
  const r=((deg%360)+360)%360;
  const c=document.createElement('canvas');
  const ctx=c.getContext('2d');
  if(r===90){c.width=srcCanvas.height;c.height=srcCanvas.width;ctx.translate(c.width,0);ctx.rotate(Math.PI/2);ctx.drawImage(srcCanvas,0,0)}
  else if(r===180){c.width=srcCanvas.width;c.height=srcCanvas.height;ctx.translate(c.width,c.height);ctx.rotate(Math.PI);ctx.drawImage(srcCanvas,0,0)}
  else if(r===270){c.width=srcCanvas.height;c.height=srcCanvas.width;ctx.translate(0,c.height);ctx.rotate(-Math.PI/2);ctx.drawImage(srcCanvas,0,0)}
  else {c.width=srcCanvas.width;c.height=srcCanvas.height;ctx.drawImage(srcCanvas,0,0)}
  return c;
}

// -------- 4. Deskew (тонкий поворот по горизонталям) --------
function _deskew(srcCanvas){
  const gray=_canvasGray(srcCanvas);
  const W=srcCanvas.width,H=srcCanvas.height;
  const targetMax=800;
  const scale=Math.min(1,targetMax/Math.max(W,H));
  const sw=Math.max(1,Math.round(W*scale)),sh=Math.max(1,Math.round(H*scale));
  const small=_resizeGray(gray,W,H,sw,sh);
  // Бинаризация (тёмный текст)
  const thr=_otsuLevel(small);
  const bin=new Uint8ClampedArray(small.length);
  for(let i=0;i<small.length;i++)bin[i]=small[i]<thr?1:0;
  // Для каждого малого угла [-5..5]° считаем скор "острых" горизонтальных линий
  // Скор: сумма квадратов rowSums (когда текст горизонтален — rowSums имеют пики)
  let bestAng=0,bestSc=-1;
  for(let ang=-5;ang<=5;ang+=0.5){
    const rad=ang*Math.PI/180;
    const s=_rowStrengthAtAngle(bin,sw,sh,rad);
    if(s>bestSc){bestSc=s;bestAng=ang}
  }
  if(Math.abs(bestAng)<0.3)return srcCanvas;
  // Применяем поворот к исходному canvas
  return _rotateByAngle(srcCanvas,bestAng);
}
function _rowStrengthAtAngle(bin,w,h,rad){
  // Для каждой "строки" ( наклонной под углом rad ) считаем сумму.
  // Используем сглаживание: идём по y, для каждого x считаем сдвинутый y' = y + x*tan(rad)
  // Чтобы было дёшево: оцениваем по диагонали семплы с шагом 1 по y.
  const tan=Math.tan(rad);
  const H=h;
  // Для каждой строки y считаем количество 1-пикселей; но y'=y0+x*tan
  // Мы хотим найти y0 такие, где по строке много тёмных пикселей.
  // Реализация: накопитель rowSums[y0] = Σ_x bin[y0 + x*tan][x]
  const sums=new Float64Array(H);
  for(let y=0;y<H;y++){
    let s=0;
    for(let x=0;x<w;x++){
      const yy=Math.round(y+x*tan);
      if(yy>=0&&yy<H)s+=bin[yy*w+x];
    }
    sums[y]=s;
  }
  // Скор — сумма квадратов (острее пики → выше скор)
  let sc=0;for(let i=0;i<H;i++)sc+=sums[i]*sums[i];
  return sc;
}
function _rotateByAngle(srcCanvas,degrees){
  const W=srcCanvas.width,H=srcCanvas.height;
  const c=document.createElement('canvas');
  c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.translate(W/2,H/2);
  ctx.rotate(-degrees*Math.PI/180);
  ctx.translate(-W/2,-H/2);
  ctx.drawImage(srcCanvas,0,0);
  return c;
}

// -------- 5. Aggressive enhance (фон/контраст/резкость) --------
function _enhanceAggressive(srcCanvas){
  const W=srcCanvas.width,H=srcCanvas.height;
  const ctx=srcCanvas.getContext('2d');
  const img=ctx.getImageData(0,0,W,H);
  const d=img.data;
  // 1) gray в отдельный массив
  const gray=new Uint8ClampedArray(W*H);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    gray[j]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;
  }
  // 2) нормализация освещённости: gray / blurred_background * 255
  const kRadius=Math.max(5,(Math.max(W,H)/50)|0);
  const bg=_gaussBlur(gray,W,H,kRadius);
  const norm=new Uint8ClampedArray(W*H);
  for(let i=0;i<gray.length;i++){
    const v=bg[i]?(gray[i]*255/bg[i]):255;
    norm[i]=v>255?255:(v<0?0:v|0);
  }
  // 3) упрощённый CLAHE (глобальное растяжение 2–98 процентилей)
  const stretched=_contrastStretch(norm,2,98);
  // 4) gamma 1/1.2 — чуть осветляет средние тона
  const gamma=new Uint8ClampedArray(W*H);
  for(let i=0;i<256;i++){/*lookup*/}
  const lut=new Uint8ClampedArray(256);
  for(let i=0;i<256;i++)lut[i]=Math.round(Math.pow(i/255,1/1.2)*255);
  for(let i=0;i<stretched.length;i++)gamma[i]=lut[stretched[i]];
  // 5) unsharp mask: gamma * 1.8 - blur(gamma, r=3) * 0.8
  const gblur=_gaussBlur(gamma,W,H,3);
  const sharp=new Uint8ClampedArray(W*H);
  for(let i=0;i<gamma.length;i++){
    const v=gamma[i]*1.8-gblur[i]*0.8;
    sharp[i]=v>255?255:(v<0?0:v|0);
  }
  // 6) white-point: пикселы >230 → 255 (убираем серый фон)
  for(let i=0;i<sharp.length;i++)if(sharp[i]>230)sharp[i]=255;

  // Возвращаем RGBA canvas
  const out=document.createElement('canvas');
  out.width=W;out.height=H;
  const octx=out.getContext('2d');
  const oimg=octx.createImageData(W,H);
  const od=oimg.data;
  for(let i=0,j=0;j<sharp.length;i+=4,j++){
    od[i]=od[i+1]=od[i+2]=sharp[j];od[i+3]=255;
  }
  octx.putImageData(oimg,0,0);
  return out;
}
function _contrastStretch(src,lowPct,highPct){
  const hist=new Uint32Array(256);
  for(let i=0;i<src.length;i++)hist[src[i]]++;
  const total=src.length;
  const lowTarget=total*lowPct/100,highTarget=total*highPct/100;
  let acc=0,lo=0,hi=255;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>=lowTarget){lo=i;break}}
  acc=0;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>=highTarget){hi=i;break}}
  if(hi<=lo+5){hi=lo+5}
  const range=hi-lo;
  const out=new Uint8ClampedArray(src.length);
  for(let i=0;i<src.length;i++){
    const v=(src[i]-lo)*255/range;
    out[i]=v>255?255:(v<0?0:v|0);
  }
  return out;
}

function diplomSetMode(m){
  diplomState.mode=m;
  diplomState.detectedSpecs=[];
  diplomState.checkSpec=null;
  renderDiplom();
}

function diplomFilterList(q){
  const s=(q||'').toLowerCase().trim();
  document.querySelectorAll('#diplomList .dipl-item').forEach(it=>{
    it.style.display=s===''||it.dataset.n.includes(s)?'':'none';
  });
}

function diplomSelectCode(c){
  diplomState.code=c;
  renderDiplom();
}

function diplomParseText(txt){
  if(!txt)return null;
  let s=txt.replace(/[,;]/g,' ').replace(/\s+/g,' ').trim();
  const patterns=[
    /(\d{2}\s+\d{2}\s+\d{2}\s+\d{2})(?!\d)/,
    /(\d{2}\s+\d{2}\s+\d{2}(?:-\d{1,2})?)(?!\d)/,
    /(\d{2}\s+\d{2}(?:-\d{1,2})?)(?!\d)/,
  ];
  for(const p of patterns){
    const m=s.match(p);
    if(m)return m[1].replace(/\s+/g,' ').trim();
  }
  const m2=s.match(/\b(\d{2})\b/);
  if(m2 && DIPLOM_DATA.codes[m2[1]])return m2[1];
  return null;
}

function diplomLevelByCode(code){
  if(!code)return 'hi';
  const groups=code.split(/\s+/);
  if(groups.length>=3 && /^3/.test(groups[2]))return 'sr';
  return 'hi';
}

function diplomAnalyze(){
  const D=diplomState;
  let code=null;
  if(D.mode==='paste'){
    code=diplomParseText(D.input);
    if(!code){
      alert('Не удалось найти код в тексте. Проверьте формат (например: 70 02 01).');
      return;
    }
    D.code=code;
  } else if(D.mode==='select'){
    if(!D.code){alert('Выберите специальность из списка');return}
    code=D.code;
  } else if(D.mode==='code'){
    const raw=(document.getElementById('diplomCodeIn')?.value||D.code).trim();
    if(!raw){alert('Введите код');return}
    code=raw.replace(/\s+/g,' ');
    D.code=code;
  }

  let level=D.edu;
  if(level==='auto')level=diplomLevelByCode(code);

  const userGroup=code.split(' ')[0];
  const userFirst2=code.split(' ').slice(0,2).join(' ');
  const matches=[];
  for(const r of DIPLOM_DATA.records){
    const list=level==='hi'?r.hi:r.sr;
    let matchedVia=null;
    for(const c of list){
      const parts=c.split(';').map(p=>p.trim());
      if(parts.includes(code)){matchedVia={recCode:c,type:'exact'};break}
      if(parts.includes(userGroup)){matchedVia={recCode:c,type:'group'};break}
      if(parts.includes(userFirst2)){matchedVia={recCode:c,type:'group2'};break}
    }
    if(matchedVia)matches.push({rec:r,via:matchedVia});
  }
  D.detectedSpecs=matches;
  D.detectedCode=code;
  D.detectedLevel=level;
  renderDiplomResult();
}

function diplomCheckSpec(){
  const D=diplomState;
  const i=parseInt(D.checkSpec);
  const rec=DIPLOM_DATA.records.find(r=>r.i===i);
  const el=document.getElementById('checkSpecResult');
  if(!rec||!el){if(el)el.innerHTML='';return}
  const code=D.detectedCode;
  const level=D.detectedLevel;
  const list=level==='hi'?rec.hi:rec.sr;
  const listOther=level==='hi'?rec.sr:rec.hi;
  const g1=code.split(' ')[0];
  const g12=code.split(' ').slice(0,2).join(' ');

  function fits(lst){
    for(const c of lst){
      const parts=c.split(';').map(p=>p.trim());
      if(parts.includes(code))return {type:'exact',match:c};
      if(parts.includes(g1))return {type:'group',match:c};
      if(parts.includes(g12))return {type:'group2',match:c};
    }
    return null;
  }

  const here=fits(list);
  const elsewhere=fits(listOther);
  const otherLvl=level==='hi'?'среднего специального':'высшего';

  let html='';
  if(here){
    html=`<div style="padding:12px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;font-size:14px">
      ✅ <b>Подходит</b> под уровень <b>${level==='hi'?'высшее':'среднее специальное'}</b>
      <div style="font-size:12px;color:#555;margin-top:6px">Специализация: ${E(rec.sp)}</div>
      ${here.type!=='exact'?`<div style="font-size:12px;color:#a16207;margin-top:4px">Совпадение по ${here.type==='group'?'группе (первая пара кода)':'первым двум парам кода'}: ${E(here.match)}</div>`:''}
    </div>`;
  } else if(elsewhere){
    html=`<div style="padding:12px;background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;font-size:14px">
      ⚠️ <b>Не подходит для ${level==='hi'?'высшего':'среднего специального'}</b>, но подходит для уровня <b>${level==='hi'?'среднее специальное':'высшее'}</b>
      <div style="font-size:12px;color:#555;margin-top:6px">Проверьте уровень образования в дипломе.</div>
    </div>`;
  } else {
    html=`<div style="padding:12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:14px">
      ❌ <b>Не подходит</b> — эта специальность отсутствует в списке допустимых для данной специализации
      <div style="font-size:12px;color:#555;margin-top:8px">Допустимые специальности для уровня <b>${level==='hi'?'высшее':'среднее специальное'}</b> (${list.length}):</div>
      <div style="font-size:12px;color:#333;margin-top:6px;max-height:160px;overflow-y:auto;padding:8px;background:#fff;border-radius:6px;border:1px solid #f3f4f6">
        ${list.length>0?list.map(c=>{const n=DIPLOM_DATA.codes[c]||'?';return `• ${E(n)} <span style="font-family:monospace;color:#888">${E(c)}</span>`}).join('<br>'):'<i>нет допустимых специальностей для этого уровня — выбрана неподходящая ступень образования</i>'}
      </div>
    </div>`;
  }
  el.innerHTML=html;
}

// ===================== CLIENTS MODULE =====================
// Модуль "Клиенты": единая точка входа к данным клиента из разных источников.
// Тянет компании из Битрикса через REST API (crm.company.list), кэширует в localStorage.
// Даёт ссылки на: карточку Битрикс, поиск в Mail.ru, Wazzup.
const CLIENTS_CACHE_KEY='mg_clients_cache_v1';
const CLIENTS_CACHE_TTL=3600000; // 1 час в миллисекундах
const BITRIX_PORTAL='https://mavisgroup.bitrix24.by';
const WAZZUP_URL=BITRIX_PORTAL+'/marketplace/app/94/';
let clientsState={
  companies:[],     // массив всех компаний из Битрикса
  loading:false,
  loadProgress:'',
  error:'',
  search:'',
  sort:'name_asc', // name_asc | name_desc | created_desc | created_asc | updated_desc
  selected:null,   // выбранная компания (для показа деталей)
  lastUpdate:null  // timestamp последнего обновления
};

// Загрузка компаний из Битрикса с пагинацией (по 50 за раз).
async function loadCompanies(forceRefresh=false){
  // Проверяем кэш
  if(!forceRefresh){
    try{
      const cached=localStorage.getItem(CLIENTS_CACHE_KEY);
      if(cached){
        const data=JSON.parse(cached);
        if(data.ts && (Date.now()-data.ts)<CLIENTS_CACHE_TTL && Array.isArray(data.companies)){
          clientsState.companies=data.companies;
          clientsState.lastUpdate=data.ts;
          return;
        }
      }
    }catch(e){console.warn('Cache read failed:',e)}
  }
  // Грузим из Битрикса
  clientsState.loading=true;
  clientsState.error='';
  clientsState.loadProgress='Подключаюсь к Битриксу...';
  renderClients();
  try{
    const all=[];
    let start=0;
    const select=['ID','TITLE','PHONE','EMAIL','DATE_CREATE','DATE_MODIFY','ASSIGNED_BY_ID'];
    while(true){
      clientsState.loadProgress=`Загружено ${all.length} компаний...`;
      renderClients();
      const params={start:start};
      select.forEach((f,i)=>params[`select[${i}]`]=f);
      params['order[ID]']='ASC';
      const data=await bxCall('crm.company.list',params);
      if(data.error){throw new Error(data.error_description||data.error)}
      const batch=data.result||[];
      all.push(...batch);
      if(data.next!==undefined && batch.length>0){
        start=data.next;
      } else {
        break;
      }
      if(all.length>50000){console.warn('Too many companies, stopping at 50000');break}
    }
    // Нормализуем телефоны и email — они приходят как массивы объектов
    const normalized=all.map(c=>{
      const phones=Array.isArray(c.PHONE)?c.PHONE.map(p=>p.VALUE).filter(Boolean):[];
      const emails=Array.isArray(c.EMAIL)?c.EMAIL.map(p=>p.VALUE).filter(Boolean):[];
      return {
        id:c.ID,
        title:c.TITLE||'(без названия)',
        phones:phones,
        emails:emails,
        searchText:((c.TITLE||'')+' '+phones.join(' ')+' '+emails.join(' ')).toLowerCase(),
        created:c.DATE_CREATE||'',
        modified:c.DATE_MODIFY||''
      };
    });
    clientsState.companies=normalized;
    clientsState.lastUpdate=Date.now();
    try{
      localStorage.setItem(CLIENTS_CACHE_KEY,JSON.stringify({
        ts:clientsState.lastUpdate,
        companies:normalized
      }));
    }catch(e){console.warn('Cache save failed:',e)}
  }catch(e){
    console.error('Load companies failed:',e);
    clientsState.error='Ошибка загрузки: '+(e.message||String(e));
  }
  clientsState.loading=false;
  clientsState.loadProgress='';
  renderClients();
}

function sortCompanies(arr,mode){
  const a=arr.slice();
  if(mode==='name_asc')a.sort((x,y)=>x.title.localeCompare(y.title,'ru'));
  else if(mode==='name_desc')a.sort((x,y)=>y.title.localeCompare(x.title,'ru'));
  else if(mode==='created_desc')a.sort((x,y)=>(y.created||'').localeCompare(x.created||''));
  else if(mode==='created_asc')a.sort((x,y)=>(x.created||'').localeCompare(y.created||''));
  else if(mode==='updated_desc')a.sort((x,y)=>(y.modified||'').localeCompare(x.modified||''));
  return a;
}

function filterCompanies(arr,q){
  const s=(q||'').toLowerCase().trim();
  if(!s)return arr;
  return arr.filter(c=>c.searchText.includes(s));
}

function fmtDate(iso){
  if(!iso)return '';
  const d=new Date(iso);
  if(isNaN(d))return '';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function mailRuSearchUrl(query){
  return 'https://e.mail.ru/search/?q_query='+encodeURIComponent(query);
}

function selectCompany(id){
  clientsState.selected=clientsState.companies.find(c=>c.id===id)||null;
  renderClients();
}
function unselectCompany(){
  clientsState.selected=null;
  renderClients();
}

      </div>
      <button onclick="loadCompanies(true)" style="padding:8px 14px;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🔄 Обновить</button>
    </div>

      <select onchange="clientsState.sort=this.value;renderClients()" style="padding:9px 11px;border:1.5px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;background:#fafbfc;cursor:pointer">

function renderClientsListItems(arr){
  if(arr.length===0){
